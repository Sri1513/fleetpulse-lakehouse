version: "3.9"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: fleetpulse_minio
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: fleetadmin
      MINIO_ROOT_PASSWORD: fleetadmin123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"